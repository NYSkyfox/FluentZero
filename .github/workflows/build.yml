# 仅手动触发：在仓库 Actions 页面点 "Run workflow" 按钮运行
name: build
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Build (Release|x64)
        working-directory: .
        run: msbuild FluentZero.sln /p:Configuration=Release /p:Platform=x64 /v:m /nologo
      - name: Run + screenshot (verify components render)
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File screenshot.ps1
      - name: Version artifacts (sha7 + build date)
        shell: pwsh
        run: |
          $sha = $env:GITHUB_SHA.Substring(0,7)
          $ts  = Get-Date -Format 'yyyyMMddHHmm'
          $ver = "FluentZero_${sha}_${ts}"
          if (Test-Path 'bin/x64/Release/FluentZero.exe') { Copy-Item 'bin/x64/Release/FluentZero.exe' "${ver}.exe" -Force }
          if (Test-Path 'fluentzero_screenshot.png') { Copy-Item 'fluentzero_screenshot.png' "${ver}.png" -Force }
          Write-Host "artifact version: ${ver}"
          Get-ChildItem FluentZero_*.exe, FluentZero_*.png -ErrorAction SilentlyContinue |
            Select-Object Name, @{n='KB';e={[math]::Round($_.Length/1KB,1)}} | Format-Table
      - name: List output
        run: |
          Write-Host "=== bin output ==="
          Get-ChildItem bin -Recurse -File | Where-Object { $_.Extension -ne ".obj" -and $_.Extension -ne ".pdb" } |
            Select-Object FullName, @{n='Size(KB)';e={[math]::Round($_.Length/1KB,1)}} | Format-Table -AutoSize
      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: FluentZero-x64-Release
          path: FluentZero_*.exe
          retention-days: 30
          if-no-files-found: error
      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FluentZero-screenshot
          path: FluentZero_*.png
          retention-days: 30
          if-no-files-found: warn
